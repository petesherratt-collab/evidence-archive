[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kibitzr-archive"
version = "0.2.1"
description = "Poll logging and raw-response retention for kibitzr"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["kibitzr>=8.0.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."kibitzr.fetcher"]
archive = "kibitzr_archive.promoter:ArchivePromoter"

[project.entry-points."kibitzr.cli"]
archive = "kibitzr_archive.cli:extend_cli"

[project.entry-points."kibitzr.before_start"]
archive = "kibitzr_archive.hook:before_start"

[tool.setuptools.packages.find]
include = ["kibitzr_archive*"]
