# UK government contract awards — trial watchlist
#
# Ten targets, split three ways:
#   1-5   recurring sources, to find out whether there is a repeatable format
#   6-9   individual award notices, watched for silent amendment
#   10    a standing accountability angle (awards made without competition)
#
# URLS RESOLVED AND SELECTORS TUNED 1 Aug 2026, from a UK connection. Every
# remaining target has been fetched and its selector verified stable across
# repeated fetches; nothing below is still a guess except the four watched-notice
# placeholders, which cannot be probed until they hold real notice IDs.
#
# ROBOTS.TXT — checked for all five hosts, and it is the reason one target is
# gone. Public Contracts Scotland disallows every agent but four search engines,
# so it has been dropped (see below). gov.uk permits this (it disallows only
# /search/all* and /*/print$). gca.gov.uk disallows query-string filter URLs but
# not the clean /agreements path used here. Contracts Finder and Find a Tender
# serve no robots.txt at all. Re-check before adding any target.
#
# Kibitzr follows redirects silently, so a moved target gets archived under its
# old address and the poll log attests to a fetch that did not happen as
# described. This is not hypothetical: it had already happened twice in this
# file — the US defence target that moved from defense.gov to war.gov, and the
# Crown Commercial Service target below, which now 301s to gca.gov.uk.
#
# Selectors marked PROVISIONAL are educated guesses. Expect to replace them.
# A target that cannot be stabilised is a finding, not a failure.
#
# RAW vs NORMALISED CHANGE — the most important thing to understand here.
#
# The archive plugin retains the RAW response, before transforms, and computes
# the poll log's `changed` flag on it. The transforms below only affect what
# kibitzr ALERTS on. So there are two different notions of "changed" in play:
#
#   raw changed      -> writes a blob, sets `changed` in the poll log
#   normalised change -> what `changes: verbose` reports to you
#
# Retaining raw is correct and deliberate: it is what lets a third party
# re-derive the extraction instead of trusting ours. But it means a page with a
# per-response nonce or viewstate writes a blob on every single poll, and the
# poll log calls every poll a change, while the tuned selector sits perfectly
# still. Measured on the surviving targets:
#
#   Contracts Finder / Find a Tender  raw churns, jq output byte-stable
#   GCA agreements                    raw churns (CSP nonce), `main` stable
#   gov.uk DHSC collection            raw stable — the only one
#
# Consequence for task 8: `kibitzr archive status` flags targets changing on
# more than half their polls as broken selectors. On this list that heuristic
# will misfire on three of four. Read it alongside kibitzr's own change reports
# before concluding a selector is wrong.
#
# The clean fix is for the plugin to record a second hash over the post-transform
# content, so the log can distinguish the two. Not done — noted as the obvious
# next change to kibitzr-archive.

# NOTE: kibitzr's simple fetcher hardcodes its User-Agent (fetcher/simple.py),
# so an identifying UA is not yet wired through. An archival crawler making an
# evidential claim should say who it is. Patch that line before the archive is
# used for anything load-bearing.

checks:

  # ---------------------------------------------------------------------
  # 1-5: recurring sources
  #
  # Prefer OCDS APIs over HTML search pages. Search results churn on every
  # request through ordering, counts and session state, and would generate
  # constant noise while telling you nothing. Structured releases reduced
  # through jq change only when the underlying awards do.
  #
  # Verify every release-package path before running: these endpoints have
  # moved before, and the notice regime changed under the Procurement Act
  # during 2025.
  # ---------------------------------------------------------------------

  # The main flow. Central government above ~£12k and wider public sector
  # above ~£30k, so this is where volume lives. Your closest equivalent to a
  # daily material source, but raw: no editorial packaging, just records.
  - name: Contracts Finder — recent awards
    url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search?stages=award
    period: 6h
    archive: true
    transform:
      - jq: '[.releases[] | {ocid, date, title: .tender.title, buyer: .buyer.name, values: [.awards[]?.value], suppliers: [.awards[]?.suppliers[]?.name]}] | sort_by(.ocid)'
      - changes: verbose
    notify:
      - stash

  # Above-threshold procurement across all four nations. Lower volume than
  # Contracts Finder, higher values — better story-per-notice ratio.
  #
  # jq FIXED 1 Aug 2026 — two defects, both verified against live payloads:
  #   1. `value: .awards[]?.value` emits one row PER AWARD, not per release.
  #      Find a Tender has releases carrying up to 94 awards, so 100 releases
  #      produced 170 rows. Now aggregated into `values: [...]`, one row each.
  #   2. `select(.tag[]? == "award")` passes a release once per matching tag,
  #      and 61 of 100 releases here carry two tags. Now `index("award")`.
  # Contracts Finder above had defect 1 latent — it happens to have exactly one
  # award per release today, so it was masked. Fixed there too.
  - name: Find a Tender — recent awards
    url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
    period: 6h
    archive: true
    transform:
      - jq: '[.releases[] | select((.tag // []) | index("award")) | {ocid, date, title: .tender.title, buyer: .buyer.name, values: [.awards[]?.value], suppliers: [.awards[]?.suppliers[]?.name]}] | sort_by(.ocid)'
      - changes: verbose
    notify:
      - stash

  # Framework recompetes. Incumbency losses are material, under-covered, and
  # concentration across a handful of suppliers is a perennial story.
  # URL CORRECTED 1 Aug 2026: www.crowncommercial.gov.uk/agreements 301s to
  # gca.gov.uk — CCS is now the Government Commercial Agency. The old address
  # still resolves, which is exactly the silent-redirect trap: it would have
  # archived fine while attesting to the wrong host.
  # Churn check: raw bytes differ between two fetches 2s apart, extracted text
  # is identical. 137 KB raw / 22 KB gzipped, so the retention cost is tolerable.
  - name: Government Commercial Agency — agreements
    url: https://www.gca.gov.uk/agreements
    period: 12h
    archive: true
    transform:
      - css: main                    # TUNED 1 Aug 2026 — see note below
      - text
      - changes: verbose
    notify:
      - stash

  # SELECTOR TUNED 1 Aug 2026. `main` is stable at MARKUP level across four
  # fetches spaced 20s apart, so `- text` is belt-and-braces rather than load
  # bearing. `ul.govuk-list--frameworks` is also stable and smaller (5.8 KB of
  # text vs 8.2 KB) if you want to shed the page furniture.
  #
  # The raw page churns and `main` does not, because the churn is a CSP `nonce`
  # — a fresh random value on eight <script>/<style> tags, all outside <main>.
  # Two consequences:
  #   1. Every poll writes a new 22 KB blob (~16 MB/yr) even when nothing moved.
  #   2. The poll log's `changed` will read true on almost every poll, so
  #      `kibitzr archive status` will report this target as changing on more
  #      than half its polls. That is the CSP nonce, NOT a broken selector.
  # See the note on raw-vs-normalised change at the top of this file.
  #
  # Rate limit: this host returns HTTP 500 to back-to-back requests. Four fetches
  # 20s apart all returned 200; probe.py's default 5s gap triggered 500s. Use
  # --gap 20 when probing it, and leave the 12h period well alone.

  # ---------------------------------------------------------------------
  # DROPPED 1 Aug 2026 — Public Contracts Scotland. Recorded, not deleted,
  # because "a target that cannot be stabilised is a finding" and the reasoning
  # is worth more than the config line. Three independent reasons, any one of
  # which is sufficient:
  #
  # 1. robots.txt says `User-agent: * / Disallow: /`. Only Googlebot, bingbot,
  #    Yahoo-slurp and Msnbot are admitted. A crawler whose entire premise is
  #    making honest evidential claims does not poll a site that has asked it
  #    not to. This alone settles it.
  # 2. The URL is the wrong page. search_mainpage.aspx is the search FORM: zero
  #    notice rows, and its largest text block (345 KB) is the category filter
  #    menu. Tuned perfectly, it would archive a filter menu twice a day.
  # 3. It is unarchivable in shape. 4.67 MB per fetch, of which __VIEWSTATE is
  #    2.0 MB and __EVENTVALIDATION another 60 KB, both churning per request —
  #    1.29 GB/year of blobs for no signal.
  #
  # Searched for a usable entry point and found none: /search/search_notices.aspx
  # and /rss/rss_notices.aspx both 404, Search_Switch.aspx?rss=1 redirects back
  # to the 4.67 MB form, no <link rel=alternate> feed is advertised, and there is
  # no api. subdomain (TLS fails).
  #
  # What is lost: below-threshold Scottish notices, which do not appear in the
  # UK-wide feeds. Find a Tender covers Scotland ABOVE threshold, so the gap is
  # specifically small Scottish awards. If that gap matters, the route is to ask
  # PCS for permission or a data export, not to crawl them anyway.
  # Sell2Wales and eTendersNI are untested — check their robots.txt FIRST.
  # ---------------------------------------------------------------------

  # Actual payments, not promised awards — departments publish spend over £25k
  # monthly. Arguably better material than award notices: what was really paid
  # rather than what was announced. The publication page is stable HTML with
  # dated CSV links, so a new month's release shows as a clean change.
  #
  # Point this at whichever department you want to follow; swap freely.
  # URL CORRECTED 1 Aug 2026: dhsc-spend-over-25-000 was a 404 with no redirect
  # record on gov.uk — the slug is dhsc-spending-over-25000. Verified 200, and
  # the only target in this file whose raw bytes are stable across two fetches.
  - name: Departmental spend over £25k — monthly release
    url: https://www.gov.uk/government/collections/dhsc-spending-over-25000
    period: 12h
    archive: true
    transform:
      # SELECTOR TUNED 1 Aug 2026. `#contents` is the gov.uk contents component
      # and holds all 97 publication links plus their dates — the payload. It is
      # stable at markup level, and tighter than `main` (10,406 vs 10,826 chars),
      # which only adds the collection title and standfirst. `main` is the
      # fallback if gov.uk ever renames the component.
      # This is the one target whose RAW bytes are stable too, so it is the only
      # one that will not write a blob on every poll.
      - css: '#contents'
      - text
      - changes: verbose
    notify:
      - stash

  # ---------------------------------------------------------------------
  # 6-9: individual award notices, watched for silent amendment
  #
  # The highest-value block and the one nobody runs. Procurement records get
  # quietly revised — values restated, suppliers changed, notices withdrawn —
  # and the original is not usually recoverable afterwards. Catching one is a
  # piece on its own, and it is where the hash chain stops being decorative:
  # you can show what the register said on the day, and that you are not the
  # one who changed it.
  #
  # Placeholders on purpose. Inventing notice IDs would be worse than leaving
  # them blank. Fill with four recent, large or contested awards — ideally a
  # mix of central government, NHS, defence and local authority. Keep the
  # period tight for the first month: amendments cluster after publication.
  #
  # These four keep `PROVISIONAL` selectors because they cannot be probed until
  # they hold real notice IDs — a placeholder URL has nothing to tune against.
  # When you fill them, run probe.py on each before the first collection. Do not
  # assume they behave like the targets above: a Contracts Finder NOTICE page is
  # a different template from the OCDS API endpoint, and nothing verified here
  # carries over to it.
  #
  # LEAD, found 1 Aug 2026 while resolving URLs: Contracts Finder tags releases
  # `award` or `awardUpdate`, and 18 of 100 in a single sample were awardUpdate.
  # That is a published amendment signal, already in the feed, free to collect.
  # It does not replace this block — an amendment the register declares is not
  # the silent revision this trial is looking for, and the tag tells you nothing
  # about what changed. But it is a good way to CHOOSE which notices to watch:
  # pull the awardUpdate ocids from target 1 and fill these slots with buyers
  # that amend often. Note this is also why targets 1 and 10 must keep
  # `stages=award` — dropping it pulls in tender/tenderAmendment noise too.
  #
  # UK-specific advantage: when one of these raises a question, FOI is
  # available as a follow-up. Public data to FOI to story is a workflow the
  # US equivalent did not offer you.
  # ---------------------------------------------------------------------

  - name: Watched award 1 — REPLACE ME
    url: https://www.contractsfinder.service.gov.uk/notice/REPLACE-WITH-NOTICE-ID
    period: 3h
    archive: true
    transform:
      - css: main                    # PROVISIONAL
      - text
      - changes: verbose
    notify:
      - stash

  - name: Watched award 2 — REPLACE ME
    url: https://www.contractsfinder.service.gov.uk/notice/REPLACE-WITH-NOTICE-ID
    period: 3h
    archive: true
    transform:
      - css: main                    # PROVISIONAL
      - text
      - changes: verbose
    notify:
      - stash

  - name: Watched award 3 — REPLACE ME
    url: https://www.find-tender.service.gov.uk/notice/REPLACE-WITH-NOTICE-ID
    period: 3h
    archive: true
    transform:
      - css: main                    # PROVISIONAL
      - text
      - changes: verbose
    notify:
      - stash

  - name: Watched award 4 — REPLACE ME
    url: https://www.find-tender.service.gov.uk/notice/REPLACE-WITH-NOTICE-ID
    period: 3h
    archive: true
    transform:
      - css: main                    # PROVISIONAL
      - text
      - changes: verbose
    notify:
      - stash

  # ---------------------------------------------------------------------
  # 10: standing accountability angle
  #
  # Awards made without competition are a defined, findable category, and the
  # pattern is the story — no scoop required.
  #
  # FIXED 1 Aug 2026. This previously used `&procedure=direct` in the URL. That
  # parameter does not exist — Contracts Finder silently ignores unknown query
  # parameters and returns the unfiltered set. Verified by substituting
  # `procedure=TOTAL_NONSENSE_XYZ`, which returns a byte-identical result to no
  # parameter at all. As written, this target was an exact duplicate of target 1:
  # double the storage, correlated changes on both, and no direct-awards signal.
  #
  # `stages=award` IS honoured — it changes both the tag mix and the result set —
  # so the failure was specific to `procedure`, not to query filtering generally.
  # Assume nothing else in a gov.uk query string filters until you have tested it
  # the same way.
  #
  # The filter now runs in jq against .tender.procurementMethod, which is present
  # in the payload. On the sample checked, 8 of 100 award releases were `direct`.
  # ---------------------------------------------------------------------

  - name: UK direct awards — no competition
    url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search?stages=award
    period: 12h
    archive: true
    transform:
      - jq: '[.releases[] | select(.tender.procurementMethod == "direct") | {ocid, date, buyer: .buyer.name, values: [.awards[]?.value], suppliers: [.awards[]?.suppliers[]?.name], method: .tender.procurementMethod}] | sort_by(.ocid)'
      - changes: verbose
    notify:
      - stash
